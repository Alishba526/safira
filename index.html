<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1710" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/safira-logo.png" />
    <link rel="apple-touch-icon" href="/safira-logo.png" />

    <!-- Primary SEO -->
    <title>SAFIRA — Luxury Pakistani Fashion & Fragrance | Pret, Perfume Online</title>
    <meta name="description" content="Shop SAFIRA — luxury Pakistani prêt-à-porter, designer dresses & exquisite oud fragrances. Free shipping across Pakistan, Cash on Delivery available. Eastern heritage, modern elegance." />
    <meta name="keywords" content="SAFIRA, luxury fashion Pakistan, designer pret, oud perfume, Pakistani dresses online, fragrance, luxury edit, Karachi" />
    <meta name="author" content="SAFIRA" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://safira.com/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="SAFIRA" />
    <meta property="og:title" content="SAFIRA — Luxury Pakistani Fashion & Fragrance" />
    <meta property="og:description" content="Where Eastern heritage meets contemporary elegance. Premium prêt-à-porter and exquisite fragrances. Shop now with COD across Pakistan." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://safira.com/" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_PK" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SAFIRA — Luxury Pakistani Fashion & Fragrance" />
    <meta name="twitter:description" content="Premium prêt-à-porter and exquisite fragrances. Shop now with COD across Pakistan." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Performance: preconnect to fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- JSON-LD: Organization + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SAFIRA",
      "url": "https://safira.com",
      "logo": "/logo.png",
      "sameAs": [
        "https://instagram.com/safira",
        "https://facebook.com/safira",
        "https://tiktok.com/@safira"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "support@safira.com",
        "areaServed": "PK",
        "availableLanguage": ["English", "Urdu"]
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SAFIRA",
      "url": "https://safira.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://safira.com/shop/new-arrivals?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
